<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Registration Portal | Sinchana M Bharadwaj</title>
    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        :root {
            --bg-color: #faf7f2;
            --card-bg: #ffffff;
            --primary-color: #1c2826;
            --accent-color: #b85d33;
            --border-color: #e5dec9;
            --text-color: #2b2420;
            --muted-color: #70675f;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(44, 34, 30, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background-color: var(--primary-color);
            color: white;
            padding: 2rem;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
        }

        .header h2 { margin: 0; font-size: 1.8rem; font-weight: 300; letter-spacing: 1px; }
        .header p { margin: 6px 0 0 0; color: #e2d9cc; font-size: 0.9rem; font-style: italic; }

        .form-body, .success-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted-color);
        }

        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            background-color: #faf7f2;
            color: var(--text-color);
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background-color: #ffffff;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-color);
        }

        .success-card {
            background: #f3efe6;
            border-left: 4px solid var(--accent-color);
            padding: 25px;
            border-radius: 4px;
        }

        .success-card h3 {
            margin-top: 0;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 8px;
        }

        .success-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dotted var(--border-color);
            font-size: 0.95rem;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Online Registration Portal</h2>
        <p>Sinchana M Bharadwaj • 1RF24CS154</p>
    </div>

    <!-- Form View -->
    <div class="form-body" id="formContainer">
        <form id="regForm">
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" id="name" value="Sinchana M Bharadwaj" required>
            </div>
            <div class="form-group">
                <label>USN:</label>
                <input type="text" id="usn" value="1RF24CS154" required>
            </div>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" id="email" value="sinchana.cs154@rvitm.edu.in" required>
            </div>
            <div class="form-group">
                <label>Program / Department:</label>
                <select id="course">
                    <option selected>Computer Science & Engineering</option>
                    <option>Information Science & Engineering</option>
                </select>
            </div>
            <div class="form-group">
                <label>Event / Activity Registration:</label>
                <select id="activity">
                    <option>Inter-College Badminton Championship</option>
                    <option>Inter-Collegiate Basketball Tournament</option>
                    <option>Technical Symposium - RAG & AI</option>
                </select>
            </div>
            <button type="submit" class="btn">Submit Application</button>
        </form>
    </div>

    <!-- Success Output View -->
    <div class="success-body" id="successContainer" style="display: none;">
        <div class="success-card">
            <h3>Registration Confirmed Successfully</h3>
            <p style="color: var(--muted-color); font-size: 0.85rem; font-style: italic; margin-bottom: 15px;">Accepted and processed via jQuery upon button click.</p>
            <div class="success-row"><span>Full Name:</span> <strong id="resName"></strong></div>
            <div class="success-row"><span>USN:</span> <strong id="resUsn"></strong></div>
            <div class="success-row"><span>Email:</span> <strong id="resEmail"></strong></div>
            <div class="success-row"><span>Department:</span> <strong id="resCourse"></strong></div>
            <div class="success-row"><span>Activity:</span> <strong id="resActivity"></strong></div>
        </div>
        <a class="back-link" id="resetBtn">← Register Another Entry</a>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#regForm').on('submit', function(e) {
            e.preventDefault();

            // Populate output fields dynamically
            $('#resName').text($('#name').val());
            $('#resUsn').text($('#usn').val());
            $('#resEmail').text($('#email').val());
            $('#resCourse').text($('#course').val());
            $('#resActivity').text($('#activity').val());

            // Smooth transition animation
            $('#formContainer').fadeOut(200, function() {
                $('#successContainer').fadeIn(300);
            });
        });

        $('#resetBtn').click(function() {
            $('#successContainer').fadeOut(200, function() {
                $('#formContainer').fadeIn(300);
            });
        });
    });
</script>

</body>
</html>
